<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1117"/>
  
  <!-- Gradient overlay -->
  <rect width="1200" height="630" fill="url(#bgGradient)" opacity="0.3"/>
  
  <!-- Logo -->
  <g transform="translate(100, 200)">
    <rect width="80" height="80" rx="15" fill="url(#logoGradient)"/>
    <path d="M40 20L60 40L40 60L20 40L40 20Z" fill="white" opacity="0.95"/>
  </g>
  
  <!-- Title -->
  <text x="100" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#c9d1d9">
    Bulk GPT
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#8b949e">
    Batch Process CSV with AI
  </text>
  
  <!-- Description -->
  <text x="100" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#8b949e" opacity="0.8">
    Transform your data at scale using Google Gemini AI
  </text>
  
  <!-- Decorative elements -->
  <circle cx="1000" cy="150" r="3" fill="#58a6ff" opacity="0.6"/>
  <circle cx="1050" cy="180" r="2" fill="#58a6ff" opacity="0.4"/>
  <circle cx="1100" cy="200" r="2.5" fill="#58a6ff" opacity="0.5"/>
  
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
</svg>


